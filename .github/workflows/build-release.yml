name: Build & Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Get commit info
        id: commit
        run: |
          SHA=$(git rev-parse HEAD)
          MSG=$(git log -1 --pretty=%s)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Use a delimiter for multiline-safe output
          echo "body<<BODY_EOF" >> "$GITHUB_OUTPUT"
          echo "Auto-built from commit $SHA" >> "$GITHUB_OUTPUT"
          echo "$MSG" >> "$GITHUB_OUTPUT"
          echo "BODY_EOF" >> "$GITHUB_OUTPUT"

      - name: Update latest release
        run: |
          # Delete existing release and tag if present
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          # Small delay to let GitHub process the deletion
          sleep 2
          # Create new release
          gh release create latest \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            --title "Latest Build" \
            --notes "${{ steps.commit.outputs.body }}" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
